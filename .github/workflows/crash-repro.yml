name: 录屏闪退诊断

# 目标：在 KVM 加速的 Android 模拟器上复现 RecordingService 启动崩溃，
# 抓 crash/main buffer 日志作为 artifact 上传，供根因定位。
# 触发：push 到 main 或 fix/* 分支（paths 过滤避免无关变更空跑）；手动。

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - 'composeApp/src/androidMain/**'
      - 'composeApp/build.gradle.kts'
      - '.github/workflows/crash-repro.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: crash-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crash-repro:
    # 钉住 24.04：ubuntu-latest 已滚动到 26.04。
    # 注意：即使 24.04，runner 用户也可能不在 kvm 组（ProbeKVM 报 no permissions），
    # 所以有下方「授权 KVM」步骤做 chmod 666 /dev/kvm workaround，否则 boot 900s 超时。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'composeApp/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Android Release APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --console=plain --no-daemon

      - name: 授权 KVM（runner 用户不在 kvm 组的 workaround）
        run: |
          echo "=== /dev/kvm 修复前 ==="
          ls -l /dev/kvm || { echo "WARN: /dev/kvm 不存在"; }
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null || true
          sudo udevadm control --reload-rules 2>/dev/null || true
          sudo udevadm trigger --name-match=kvm 2>/dev/null || true
          echo "=== /dev/kvm 修复后 ==="
          ls -l /dev/kvm || true

      - name: 启动模拟器并复现 RecordingService 启动
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          script: |
            # android-emulator-runner 会把 script 逐行用 sh -c 执行，
            # 多行 if/fi 块会被拆散（iter4 死因：Syntax error end of file），
            # 所以只留一行调用独立脚本文件。
            bash "$GITHUB_WORKSPACE/.github/scripts/diag-crash-repro.sh"

      - name: 上传诊断 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-diag-${{ github.run_id }}
          path: |
            crash-buffer.log
            main-buffer.log
            service-state.txt
            notif-state.txt
          retention-days: 14
